<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ESP32 Speaker</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;margin:0;padding:24px;background:#1a1a1a;color:#eee;max-width:480px}
h1{color:#4fc3f7;margin:0 0 16px;font-size:22px}
.card{background:#2a2a2a;border-radius:8px;padding:16px;margin-bottom:12px}
.status{color:#81c784}.status.off{color:#e57373}
label{display:block;margin:10px 0 4px;font-size:13px;color:#aaa}
input{width:100%;padding:10px;border-radius:4px;border:1px solid #444;background:#1a1a1a;color:#eee;font-size:14px;box-sizing:border-box}
button{background:#4fc3f7;color:#1a1a1a;border:none;padding:10px 20px;border-radius:4px;cursor:pointer;font-size:14px;margin-top:12px}
button:active{transform:scale(.97)}
.msg{font-size:13px;margin-top:8px;min-height:18px}.msg.ok{color:#81c784}.msg.err{color:#e57373}
</style>
</head>
<body>
<h1>🎵 ESP32 Speaker</h1>

<div class="card">
<div>AP IP: <span id="ap-ip">—</span></div>
<div>STA: <span id="sta-status" class="status off">—</span></div>
<div id="sta-detail"></div>
</div>

<div class="card">
<form id="wifi-form">
<label>SSID</label>
<input id="ssid" name="ssid" placeholder="Your WiFi name" required maxlength="32">
<label>Password (blank = open)</label>
<input id="pass" type="password" placeholder="••••••" maxlength="64">
<button type="submit">Save &amp; Connect</button>
</form>
<div id="msg" class="msg"></div>
</div>

<script>
function showMsg(t,ok){const e=document.getElementById('msg');e.textContent=t;e.className='msg '+(ok?'ok':'err')}

async function refreshWifi(){
 try{
  const r=await fetch('/api/wifi'),d=await r.json();
  const s=document.getElementById('sta-status'),p=document.getElementById('sta-detail');
  if(d.configured){
   document.getElementById('ssid').value=d.ssid||'';
   if(d.connected){
    s.textContent='connected to "'+d.ssid+'"';s.className='status';
    p.textContent=d.ip?('IP: '+d.ip):'';
   }else{
    s.textContent='connecting to "'+d.ssid+'"';s.className='status off';p.textContent='';
   }
  }else{
   s.textContent='not configured';s.className='status off';p.textContent='';
  }
 }catch(e){}
}

async function refreshStatus(){
 try{const r=await fetch('/api/status'),d=await r.json();if(d.ip)document.getElementById('ap-ip').textContent=d.ip;}catch(e){}
}

document.getElementById('wifi-form').addEventListener('submit',async ev=>{
 ev.preventDefault();
 const ssid=document.getElementById('ssid').value.trim();
 if(!ssid){showMsg('SSID required',false);return}
 showMsg('Saving...',true);
 try{
  const r=await fetch('/api/wifi',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},
   body:'ssid='+encodeURIComponent(ssid)+'&pass='+encodeURIComponent(document.getElementById('pass').value)});
  if(!r.ok)throw new Error('HTTP '+r.status);
  showMsg('Saved. Connecting...',true);
  setTimeout(refreshWifi,2000);setTimeout(refreshWifi,6000);
 }catch(e){showMsg('Save failed: '+e.message,false)}
});

refreshStatus();refreshWifi();setInterval(refreshWifi,8000);
</script>
</body>
</html>
